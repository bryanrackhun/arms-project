{# Empty state, placed inside the single cell of a table's {% empty %} row. #}
{# Usage: {% include "core/_empty.html" with title="No services yet" hint="Add one first." %} #}
<div class="empty-state">
  <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 7.6 5.3 4h13.4L21 7.6v10.9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5Z"/>
    <path d="M3 7.6h5l1.2 2.3h5.6L16 7.6h5"/>
  </svg>
  <p class="empty-state__title">{{ title }}</p>
  {% if hint %}<p class="empty-state__hint">{{ hint }}</p>{% endif %}
</div>
